# .github/workflows/pipeline.yml
name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "dev", "test", "prod" ]
  pull_request:
    branches: [ "dev", "test", "prod" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:

  lint:
    name: Lint Code with Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: github/super-linter@v4
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATE_CHANGED_FILES_ONLY: true
          VALIDATE_ALL_CODEBASE: false
          IGNORE_GITIGNORED_FILES: true
          IGNORE_DUPLICATION: true
          VALIDATE_DOTNET: true
          VALIDATE_CSHARP: true

  build-test-app:
    name: Restore, Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --no-build --verbosity normal

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-test-app
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   
        with:
          args:
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          projectBaseDir: .

  build-and-push:
    name: Build & Push Docker Image to ECR
    needs: sonarcloud
    if: ${{ github.event_name == 'push' }}
    uses: VotingApp-DevOps-288126-ORT/voting.infra/.github/workflows/build-push-docker-image.yaml@prod
    with:
      tag: ${{ github.sha }}-${{ github.ref_name }}
    secrets: inherit

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    if: ${{ github.event_name == 'push' }}
    uses: VotingApp-DevOps-288126-ORT/voting.infra/.github/workflows/deploy-to-k8.yaml@prod
    with:
      cluster_name: cluster-eks-${{ github.ref_name }}  
      manifest_path: ./k8s-specifications/worker-deployment.yaml                        
      environment: ${{ github.ref_name }}                      
      commit_sha: ${{ github.sha }} 
    secrets: inherit

  notify:
    name: Send deployment notification via Gmail
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Build email body
        id: build_email
        run: |
          APP="worker"
          ENV="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          {
            echo "✅ Deploy de *${APP}* completado en *${ENV}*"
            echo
            echo "🔖 Commit: \`${COMMIT}\`"
            echo "📅 Fecha: ${DATE}"
            echo
            echo "¡Saludos!"
          } > email_body.txt

          # Exponer el cuerpo como salida
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat email_body.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send email via Gmail SMTP
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER_ADDRESS }}
          server_port:    ${{ secrets.SMTP_SERVER_PORT }}
          username:       ${{ secrets.GMAIL_USERNAME }}
          password:       ${{ secrets.GMAIL_APP_PASSWORD }}
          from:           ${{ secrets.GMAIL_USERNAME }}
          to:             ${{ secrets.GMAIL_USERNAME }}
          subject:        "✅ Deploy de worker a ${{ github.ref_name }} exitoso"
          body:           ${{ steps.build_email.outputs.body }}

